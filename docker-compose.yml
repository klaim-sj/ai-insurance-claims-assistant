# OPSIONAL: hanya untuk development lokal. Cloud session tidak memakai Docker.
# Kredensial di bawah hanya untuk lokal; jangan dipakai di production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims_local_only
      POSTGRES_DB: claims_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
