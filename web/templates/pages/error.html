{{define "body"}}
<main id="main" tabindex="-1" class="flex min-h-full items-center justify-center px-4 py-12 focus:outline-none">
  <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 text-center shadow-sm">
    <h1 class="text-xl font-bold">{{.Title}}</h1>
    <p class="mt-2 text-sm text-slate-600" role="alert">{{.Error}}</p>
    <p class="mt-6"><a href="/" class="rounded text-sm font-medium text-indigo-700 underline focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600">Kembali ke halaman utama</a></p>
  </div>
</main>
{{end}}
