{{define "body"}}
<main id="main" tabindex="-1" class="flex min-h-full items-center justify-center px-4 py-12 focus:outline-none">
  <div class="w-full max-w-sm">
    <h1 class="text-center text-2xl font-bold tracking-tight text-slate-900">AI Claims Assistant</h1>
    <p class="mt-2 text-center text-sm text-slate-600">Masuk untuk melanjutkan</p>

    <form method="post" action="/login" class="mt-8 rounded-lg border border-slate-200 bg-white p-6 shadow-sm" novalidate>
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="space-y-5">

      {{if .Error}}
      <div role="alert" class="rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900">{{.Error}}</div>
      {{end}}

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus
               value="{{.Email}}"
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Kata sandi</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600">
      </div>

      <button type="submit" class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2">Masuk</button>
      </div>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">Aplikasi demonstrasi. Seluruh data bersifat sintetis/fiktif.</p>
  </div>
</main>
{{end}}
