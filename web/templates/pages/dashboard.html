{{define "content"}}
<h1 class="text-2xl font-bold tracking-tight">Dashboard</h1>
<p class="mt-1 text-sm text-slate-600">Selamat datang, {{.User.Name}}. Ringkasan klaim akan tersedia pada tahap berikutnya.</p>

<section aria-labelledby="kpi-heading" class="mt-6">
  <h2 id="kpi-heading" class="sr-only">Ringkasan klaim</h2>
  <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    {{range .KPIs}}
    <li class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-600">{{.}}</p>
      <p class="mt-2 text-2xl font-semibold text-slate-400" aria-label="Belum ada data">—</p>
    </li>
    {{end}}
  </ul>
</section>

<section aria-labelledby="menu-heading" class="mt-8 rounded-lg border border-dashed border-slate-300 bg-white p-6">
  <h2 id="menu-heading" class="text-base font-semibold">Menu untuk peran {{.User.Role.Label}}</h2>
  <ul class="mt-3 list-inside list-disc text-sm text-slate-700">
    {{range .Menu}}<li><a class="rounded text-indigo-700 underline focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600" href="{{.Path}}">{{.Label}}</a></li>{{end}}
  </ul>
</section>
{{end}}
