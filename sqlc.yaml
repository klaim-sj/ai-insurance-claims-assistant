version: "2"
sql:
  - engine: "postgresql"
    # Hanya migrasi aplikasi; migrasi skema River (*_river_*.sql) sengaja
    # tidak dibaca agar internal/db/models.go hanya berisi tabel aplikasi.
    # Migrasi aplikasi baru WAJIB ditambahkan di sini (dijaga oleh
    # migrations.TestSqlcSchemaListsAppMigrations).
    schema:
      - "migrations/00001_create_users.sql"
      - "migrations/00002_create_claims.sql"
      - "migrations/00003_create_claim_documents.sql"
      - "migrations/00004_create_audit_logs.sql"
      - "migrations/00005_create_sessions.sql"
      - "migrations/00006_create_claim_status_histories.sql"
      - "migrations/00007_create_claim_number_counters.sql"
      - "migrations/00008_claim_documents_upload.sql"
      - "migrations/00009_ocr_extraction.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
